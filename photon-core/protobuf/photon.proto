message EngramEntry {
  string key        = 1;
  bytes  value      = 2;
  int64  version    = 3;
  int64  created_at = 4;
  int64  updated_at = 5;
  int64  expires_at = 6;
}

message EngramStoreResponse {
  string key        = 1;
  int64  version    = 2;
  int64  created_at = 3;
  int64  updated_at = 4;
  int64  expires_at = 5;
}

message EngramListResponse {
  repeated string keys     = 1;
  int32           total    = 2;
  bool            has_more = 3;
}

