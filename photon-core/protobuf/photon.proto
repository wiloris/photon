}

// ── MediaResource payloads ────────────────────────────────────────────────────

// MediaRef — запись о вложении в Message.props.photon_media[].
//
// Состав и неизменяемость полей заморожены ADR-048 §3: media_id, sha256, size,
// mime, name обязательны и неизменяемы для данного media_id; w/h опциональны и
// только для изображений. Серверный жизненный цикл (expires_at, state) сюда НЕ
// входит — он живёт в MediaStore и запрашивается по требованию, иначе истечение
// TTL требовало бы править сообщение.
message MediaRef {
  string media_id = 1;
  string sha256   = 2; // hex, 64 символа
  int64  size     = 3;
  string mime     = 4;
  string name     = 5; // исходное имя файла
  int32  w        = 6; // только для изображений
  int32  h        = 7;
}

// MediaUploadPayload — второй JSON-кадр стрима загрузки; далее идёт тело.
//
// sha256 объявляется ДО передачи: это делает проверку целостности
// двусторонней, а не только клиентской (media-transfer.md §9).
message MediaUploadPayload {
  string channel_id  = 1;
  string name        = 2;
  string mime        = 3;
  string sha256      = 4;
  int64  body_length = 5; // обязателен; приёмник читает ровно столько байт
}

message MediaIDPayload { string media_id = 1; }

// ── MediaResource responses ───────────────────────────────────────────────────

message MediaUploadResponse {
  string media_id = 1;
  string sha256   = 2;
  int64  size     = 3;
}

// MediaDownloadHeader — JSON-ответ, ПРЕДШЕСТВУЮЩИЙ телу. Порядок обратен
// загрузке намеренно: иначе клиент не отличил бы отказ от начала данных, не
// прочитав их (media-transfer.md §1).
message MediaDownloadHeader {
  string media_id    = 1;
  string sha256      = 2;
  int64  size        = 3;
  string mime        = 4;
  string name        = 5;
  int64  body_length = 6;
}

message MediaInfoResponse {
  MediaRef media = 1;
}

